name: Build & Release TwinWidget Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p release_output
          cp android/app/build/outputs/apk/debug/app-debug.apk release_output/TwinWidget.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinWidget-Android-APK
          path: release_output/TwinWidget.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "TwinWidget Live Android APK (v1.0.0)"
          body: |
            ### 📱 TwinWidget Live-Connected Android APK
            
            - **2x2 Live Home Screen Widget**: Stays on your wallpaper, updates in real-time.
            - **Live Auto-Updating Shell**: Loads directly from GitHub Pages (`https://harshit-tyagi1.github.io/TwinWidget/`), so every future GitHub commit updates both phones instantly without reinstalling!
            - **Military-Grade E2EE**: AES-256-GCM encrypted notes, drawings, photos & camera captures.
            
            #### 📥 Installation:
            1. Download `TwinWidget.apk` below on your Android phone.
            2. Tap to Install (Allow Unknown Sources / Install anyway).
            3. Long-press on your home screen -> **Widgets** -> **TwinWidget** -> Place the 2x2 widget!
          files: release_output/TwinWidget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
