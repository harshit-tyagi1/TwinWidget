name: Build & Release TwinWidget Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch AGP, Lint, and Dependencies Across Entire Project
        run: |
          find . -name "build.gradle" -exec sed -i 's/8\.13\.0/8.7.3/g' {} +
          find . -name "build.gradle" -exec sed -i 's/abortOnError = true/abortOnError = false/g' {} +
          find . -name "build.gradle" -exec sed -i 's/warningsAsErrors = true/warningsAsErrors = false/g' {} +
          find android -name "AndroidManifest.xml" -exec sed -i 's/xmlns:amazon="[^"]*"//g' {} +
          find android/capacitor-cordova-android-plugins -name "AndroidManifest.xml" -exec sed -i 's/android:usesCleartextTraffic="true"//g' {} +
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.3'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.13.1'
              androidxFragmentVersion = '1.8.5'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --no-daemon 2>&1 | tee ../gradle.log || {
            echo "::error::Gradle assembleDebug failed! Dumping tail of log:"
            tail -n 120 ../gradle.log
            exit 1
          }

      - name: Locate & Package APK
        run: |
          mkdir -p release_output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release_output/TwinWidget.apk \;

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinWidget-Android-APK
          path: release_output/TwinWidget.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "TwinWidget Live Android APK (v1.0.0)"
          body: |
            ### 📱 TwinWidget Live-Connected Android APK
            
            - **2x2 Live Home Screen Widget**: Stays on your wallpaper, updates in real-time.
            - **Live Auto-Updating Shell**: Loads directly from GitHub Pages (`https://harshit-tyagi1.github.io/TwinWidget/`), so every future GitHub commit updates both phones instantly without reinstalling!
            - **Military-Grade E2EE**: AES-256-GCM encrypted notes, drawings, photos & camera captures.
            
            #### 📥 Installation:
            1. Download `TwinWidget.apk` below on your Android phone.
            2. Tap to Install (Allow Unknown Sources / Install anyway).
            3. Long-press on your home screen -> **Widgets** -> **TwinWidget** -> Place the 2x2 widget!
          files: release_output/TwinWidget.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
